name: USB-Stick-Abbild

# AleGamestation OS als Disk-Abbild für USB-Sticks („wie Batocera“): fertiges System zum Draufschreiben,
# startet auf jedem PC vom Stick. Läuft im Release nach build-os, oder einzeln über Actions → „Run workflow“
# (baut dann aus dem aktuellen :stable-Abbild und hängt es an das Release der Version in package.json).
# Größer als 2 GB → komprimiert (xz) und in Teile zerlegt (GitHub erlaubt max. 2 GB pro Datei).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build-usb:
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: alegamestation-os
            name: AleGamestation-OS-USB
          - image: alegamestation-os-nvidia
            name: AleGamestation-OS-NVIDIA-USB
    steps:
      - uses: actions/checkout@v5

      - name: Speicherplatz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune -af || true
          df -h /

      - name: System-Abbild laden
        run: sudo podman pull "ghcr.io/aleb-roni/${{ matrix.image }}:stable"

      - name: Disk-Abbild bauen (bootc-image-builder)
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/os/usb/config.toml:/config.toml:ro" \
            -v "$PWD/output:/output" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            build --output /output --type raw --rootfs btrfs --use-librepo=True \
            "ghcr.io/aleb-roni/${{ matrix.image }}:stable"
          sudo find output -type f -exec ls -lsh {} +

      - name: Komprimieren und aufteilen
        run: |
          VER="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)"
          RAW="$(sudo find output -name 'disk.raw' | head -1)"
          [ -n "$RAW" ] || { echo "disk.raw fehlt" >&2; exit 1; }
          echo "Abbild: $(sudo du -h --apparent-size "$RAW" | cut -f1) (belegt $(sudo du -h "$RAW" | cut -f1))"
          sudo podman rmi -af >/dev/null 2>&1 || true
          mkdir -p dist
          BASE="dist/${{ matrix.name }}-$VER.img.xz"
          sudo xz -T0 -4 -c "$RAW" | split -b 1900M -d -a 2 - "$BASE.part"
          sudo rm -f "$RAW"
          ( cd dist && cat ${{ matrix.name }}-$VER.img.xz.part* | sha256sum | sed "s|-|${{ matrix.name }}-$VER.img.xz|" > ${{ matrix.name }}-$VER.img.xz.sha256 )
          ls -lh dist; cat dist/*.sha256
          cat "$BASE".part* | xz -t && echo "xz OK"

      - name: Zum Release hinzufügen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)"
          gh release upload "v$VER" dist/${{ matrix.name }}-$VER.img.xz.part* dist/${{ matrix.name }}-$VER.img.xz.sha256 \
            os/usb/zusammenfuegen.bat --repo "$GITHUB_REPOSITORY" --clobber
