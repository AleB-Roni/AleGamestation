name: Release

# Neues Release: Version in package.json erhöhen, committen und pushen, dann
#   - Tag pushen (git tag v1.0.1 && git push origin v1.0.1) oder
#   - auf GitHub unter Actions → Release → "Run workflow" klicken (Tag wird automatisch angelegt)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Windows-Test – Spiele starten und beenden
        run: node test/windows/kill.win.js

      - name: Windows-Test – Overlay über Vollbild (Fenster-Fokus)
        run: node test/windows/focus.win.js

      - name: Versions-Tag anlegen (falls noch nicht vorhanden)
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG existiert bereits"
          else
            git tag "$TAG" && git push origin "$TAG"
          fi

      - name: Installer bauen
        run: npx electron-builder --win --publish never

      - name: Auf GitHub veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(node -p "require('./package.json').version")"
          TAG="v$VER"
          REPO="$GITHUB_REPOSITORY"
          # Bestehende Releases dieser Version entfernen (z.B. bei erneutem Ausführen)
          for id in $(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\") | .id"); do
            gh api -X DELETE "repos/$REPO/releases/$id"
          done
          # Unvollständige Releases (ohne Installer) aufräumen
          for id in $(gh api "repos/$REPO/releases" --paginate --jq '.[] | select(([.assets[].name | endswith(".exe")] | any) | not) | .id'); do
            gh api -X DELETE "repos/$REPO/releases/$id"
          done
          # Änderungen seit der letzten Version aus den Commit-Nachrichten
          PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          RANGE="${PREV:+$PREV..}$TAG"
          # Aufzählungspunkte übernehmen, eingerückte Folgezeilen an den Punkt anhängen
          git log --no-merges --format='- %s%n%b' "$RANGE" | awk '
            /^- / { if (item) print item; item = $0; next }
            /^  +[^ -]/ { if (item) { sub(/^ +/, ""); item = item " " $0 }; next }
            { if (item) print item; item = "" }
            END { if (item) print item }' > notes.md || true
          [ -s notes.md ] || echo "- Verbesserungen und Fehlerbehebungen" > notes.md
          printf '\n**Installation (Windows):** AleGamestation-Setup-%s.exe herunterladen und starten. Installierte Versionen aktualisieren sich über das Menü → „Nach Updates suchen“.\n' "$VER" >> notes.md
          printf '\n**Linux:** AleGamestation-%s-linux-x86_64.AppImage (ausführbar machen und starten).\n' "$VER" >> notes.md
          printf '\n**AleGamestation OS:** AleGamestation-OS-Installer-%s.iso (NVIDIA: AleGamestation-OS-NVIDIA-Installer) auf einen USB-Stick schreiben, davon starten und installieren – Internet nötig. Anleitung: os/README.md\n' "$VER" >> notes.md
          gh release create "$TAG" \
            "dist/AleGamestation-Setup-$VER.exe" \
            "dist/AleGamestation-Setup-$VER.exe.blockmap" \
            "dist/latest.yml" \
            --repo "$REPO" --title "AleGamestation $VER" --latest \
            --notes-file notes.md

  build-linux:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests (Linux)
        run: npm test

      - name: Linux-Version bauen (AppImage, tar.gz)
        run: npx electron-builder --linux --publish never

      - name: Zum Release hinzufügen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(node -p "require('./package.json').version")"
          gh release upload "v$VER" dist/AleGamestation-$VER-linux-*.AppImage dist/AleGamestation-$VER-linux-*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

      - name: App für das System-Abbild weitergeben
        run: tar -C dist -czf linux-unpacked.tgz linux-unpacked

      - uses: actions/upload-artifact@v4
        with:
          name: linux-unpacked
          path: linux-unpacked.tgz
          retention-days: 3

  build-os:
    needs: build-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: alegamestation-os
            base: ghcr.io/ublue-os/bazzite-deck:stable
          - image: alegamestation-os-nvidia
            base: ghcr.io/ublue-os/bazzite-deck-nvidia:stable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: linux-unpacked

      - name: App auspacken
        run: mkdir -p dist && tar -C dist -xzf linux-unpacked.tgz && ls dist/linux-unpacked | head

      - name: Speicherplatz schaffen (Bazzite-Abbild ist groß)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          sudo mkdir -p /mnt/containers && sudo chown "$USER" /mnt/containers
          df -h / /mnt

      - name: Abbild bauen
        run: |
          VER="$(node -p "require('./package.json').version")"
          podman --root /mnt/containers build -f os/Containerfile \
            --build-arg BASE_IMAGE=${{ matrix.base }} --build-arg APP_VERSION="$VER" \
            -t "ghcr.io/aleb-roni/${{ matrix.image }}:stable" .
          podman --root /mnt/containers tag "ghcr.io/aleb-roni/${{ matrix.image }}:stable" "ghcr.io/aleb-roni/${{ matrix.image }}:$VER"
          podman --root /mnt/containers tag "ghcr.io/aleb-roni/${{ matrix.image }}:stable" "ghcr.io/aleb-roni/${{ matrix.image }}:latest"

      - name: Prüfen (Dateien im Abbild)
        run: |
          podman --root /mnt/containers run --rm "ghcr.io/aleb-roni/${{ matrix.image }}:stable" bash -c '
            set -e
            test -x /usr/lib/alegamestation/alegamestation
            test -x /usr/bin/alegamestation-session
            test -f /usr/share/wayland-sessions/gamescope-session-alegamestation.desktop
            test -f /usr/share/gamescope-session-plus/sessions.d/alegamestation
            grep -q alegamestation /usr/lib/sddm/sddm.conf.d/holo.conf
            command -v xprop
            command -v tailscale && test -x /usr/libexec/alegamestation-tailscale
            command -v gamescope-session-plus || ls /usr/share/gamescope-session-plus/gamescope-session-plus
            echo "Abbild OK: $(cat /usr/share/alegamestation/os-version)"'

      - name: Veröffentlichen (GitHub Container Registry)
        run: |
          VER="$(node -p "require('./package.json').version")"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman --root /mnt/containers login ghcr.io -u "${{ github.actor }}" --password-stdin
          for t in stable latest "$VER"; do
            podman --root /mnt/containers push "ghcr.io/aleb-roni/${{ matrix.image }}:$t"
          done

  build-iso:
    needs: build-os
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: alegamestation-os
            iso: AleGamestation-OS-Installer
          - image: alegamestation-os-nvidia
            iso: AleGamestation-OS-NVIDIA-Installer
    steps:
      - name: Werkzeuge installieren
        run: dnf install -y --setopt=install_weak_deps=False lorax xorriso isomd5sum cpio curl git gh

      - uses: actions/checkout@v5

      - name: Installer-ISO bauen
        run: |
          VER="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)"
          os/installer/build-iso.sh "ghcr.io/aleb-roni/${{ matrix.image }}:stable" "dist/${{ matrix.iso }}-$VER.iso"
          SIZE=$(stat -c %s "dist/${{ matrix.iso }}-$VER.iso")
          echo "Größe: $((SIZE / 1048576)) MB"
          [ "$SIZE" -lt 2000000000 ] || { echo "ISO zu groß für GitHub-Releases" >&2; exit 1; }

      - name: Zum Release hinzufügen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VER="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)"
          gh release upload "v$VER" "dist/${{ matrix.iso }}-$VER.iso" --repo "$GITHUB_REPOSITORY" --clobber
