name: Release

# Neues Release: Version in package.json erhöhen, committen und pushen, dann
#   - Tag pushen (git tag v1.0.1 && git push origin v1.0.1) oder
#   - auf GitHub unter Actions → Release → "Run workflow" klicken (Tag wird automatisch angelegt)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Versions-Tag anlegen (falls noch nicht vorhanden)
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG existiert bereits"
          else
            git tag "$TAG" && git push origin "$TAG"
          fi

      - name: Installer bauen
        run: npx electron-builder --win --publish never

      - name: Auf GitHub veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(node -p "require('./package.json').version")"
          TAG="v$VER"
          REPO="$GITHUB_REPOSITORY"
          # Bestehende Releases dieser Version entfernen (z.B. bei erneutem Ausführen)
          for id in $(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\") | .id"); do
            gh api -X DELETE "repos/$REPO/releases/$id"
          done
          # Unvollständige Releases (ohne Installer) aufräumen
          for id in $(gh api "repos/$REPO/releases" --paginate --jq '.[] | select(([.assets[].name | endswith(".exe")] | any) | not) | .id'); do
            gh api -X DELETE "repos/$REPO/releases/$id"
          done
          # Änderungen seit der letzten Version aus den Commit-Nachrichten
          PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          RANGE="${PREV:+$PREV..}$TAG"
          # Aufzählungspunkte übernehmen, eingerückte Folgezeilen an den Punkt anhängen
          git log --no-merges --format='- %s%n%b' "$RANGE" | awk '
            /^- / { if (item) print item; item = $0; next }
            /^  +[^ -]/ { if (item) { sub(/^ +/, ""); item = item " " $0 }; next }
            { if (item) print item; item = "" }
            END { if (item) print item }' > notes.md || true
          [ -s notes.md ] || echo "- Verbesserungen und Fehlerbehebungen" > notes.md
          printf '\n**Installation:** AleGamestation-Setup-%s.exe herunterladen und starten. Installierte Versionen aktualisieren sich über das Menü → „Nach Updates suchen“.\n' "$VER" >> notes.md
          gh release create "$TAG" \
            "dist/AleGamestation-Setup-$VER.exe" \
            "dist/AleGamestation-Setup-$VER.exe.blockmap" \
            "dist/latest.yml" \
            --repo "$REPO" --title "AleGamestation $VER" --latest \
            --notes-file notes.md
