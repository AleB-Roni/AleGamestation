name: Release

# Neues Release: Version in package.json erhöhen, committen und pushen, dann
#   - Tag pushen (git tag v1.0.1 && git push origin v1.0.1) oder
#   - auf GitHub unter Actions → Release → "Run workflow" klicken (Tag wird automatisch angelegt)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Versions-Tag anlegen (falls noch nicht vorhanden)
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG existiert bereits"
          else
            git tag "$TAG" && git push origin "$TAG"
          fi

      - name: Installer bauen und auf GitHub veröffentlichen
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
